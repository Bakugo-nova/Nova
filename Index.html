<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova</title>
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--mut:#6b6a65;--ac:#4f46e5;--acf:#fff;--bd:#e3e1da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ececea;--card:#222226;--mut:#9a9a96;--ac:#8b85ff;--acf:#111;--bd:#34343a}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#ececea;--card:#222226;--mut:#9a9a96;--ac:#8b85ff;--acf:#111;--bd:#34343a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.lg{display:flex;align-items:center;gap:10px}
header label{font-size:13px;font-weight:400;color:var(--mut)}
main{flex:1;overflow-y:auto;padding:0 12px 12px}
section{display:none}section.on{display:block}
.row{display:flex;gap:8px;margin:8px 0}
input,textarea,select{flex:1;min-width:0;font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:var(--acf);font-weight:600}
button.g{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
button.on{outline:3px solid var(--ac);outline-offset:2px}
.b{padding:10px 12px;border-radius:14px;margin:6px 0;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.u{background:var(--ac);color:var(--acf);margin-left:auto}
.a{background:var(--card);border:1px solid var(--bd)}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:6px 0;display:flex;gap:10px;align-items:flex-start;white-space:pre-wrap}
.it span{flex:1}.it.d span{text-decoration:line-through;color:var(--mut)}
.x{background:none;color:var(--mut);padding:0 4px}
.out{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px}
.mut{color:var(--mut);font-size:14px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 0;font-size:12px;font-weight:500}
nav button.on{color:var(--ac);outline:0;font-weight:700}
nav i{display:block;font-style:normal;font-size:20px}
</style></head><body>
<header><span class="lg"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="10" style="fill:var(--ac)"/><line x1="17" y1="6" x2="17" y2="10" stroke-width="2" stroke-linecap="round" style="stroke:var(--acf)"/><circle cx="17" cy="5.5" r="2" style="fill:var(--acf)"/><rect x="7" y="10" width="20" height="15" rx="6" style="fill:var(--acf)"/><circle cx="13" cy="17" r="2.2" style="fill:var(--ac)"/><circle cx="21" cy="17" r="2.2" style="fill:var(--ac)"/><path d="M13 21.2q4 2.4 8 0" fill="none" stroke-width="1.6" stroke-linecap="round" style="stroke:var(--ac)"/></svg>Nova</span> <label><input type="checkbox" id="vz" style="flex:none"> Leer en voz alta</label></header>
<main>
<section id="t-chat" class="on">
 <div id="log"><div class="b a">Hola, soy Nova, tu asistente. Escríbeme o usa el micrófono 🎤</div></div>
 <div class="row"><input id="ci" placeholder="Escribe tu mensaje"><button class="g mic" data-for="ci">🎤</button><button id="send">Enviar</button></div>
</section>
<section id="t-notas">
 <div class="row"><textarea id="ni" rows="2" placeholder="Nueva nota"></textarea><button class="g mic" data-for="ni">🎤</button></div>
 <div class="row"><button id="nadd" style="flex:1">Guardar nota</button></div>
 <div id="nl"></div>
</section>
<section id="t-tareas">
 <div class="row"><input id="ti" placeholder="Nueva tarea"><button class="g mic" data-for="ti">🎤</button><button id="tadd">+</button></div>
 <div id="tl"></div>
</section>
<section id="t-video">
 <p class="mut">Ideas de videos cortos para ganar audiencia, hechas con solo tu celular.</p>
 <div class="row"><select id="vp"><option>TikTok</option><option>Facebook Reels</option><option>YouTube Shorts</option></select></div>
 <div class="row"><input id="vt" placeholder="Tema o nicho (ej. recetas rápidas)"><button class="g mic" data-for="vt">🎤</button></div>
 <div class="row"><button id="vgo" style="flex:1">Generar 3 ideas</button></div>
 <div id="vo"></div>
</section>
<section id="t-voz">
 <p>Toca el micrófono para dictar. El texto se escribe en el campo que usaste por última vez.</p>
 <div class="row"><textarea id="vi" rows="5" placeholder="Aquí aparece lo que dictas"></textarea></div>
 <div class="row"><button class="mic" data-for="vi" style="flex:1">🎤 Dictar</button><button class="g" id="vcopy">Copiar</button><button class="g" id="vread">Leer</button></div>
 <p class="mut" id="vmsg"></p>
</section>
</main>
<nav>
 <button class="on" data-t="chat"><i>💬</i>Chat</button>
 <button data-t="notas"><i>📝</i>Notas</button>
 <button data-t="tareas"><i>✅</i>Tareas</button>
 <button data-t="video"><i>🎬</i>Videos</button>
 <button data-t="voz"><i>🎙️</i>Voz</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const st={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let sample=null,dict=null,target=null,listening=false;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='t-'+b.dataset.t));
});
function speak(t){try{if($('#vz').checked&&window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';speechSynthesis.speak(u)}}catch(e){}}
function mkEl(cls,txt){const d=document.createElement('div');d.className=cls;d.textContent=txt;return d}
// IA
async function ai(prompt,onText){
 if(!sample)throw {code:'no_ia'};
 return sample(prompt,{cache:false,onText});
}
function err(e){return e&&e.code==='no_ia'?'El chat con IA todavía no está conectado. Es el siguiente paso.':e&&e.code==='not_granted'?'Necesitas aceptar el permiso para usar la IA.':e&&e.code==='rate_limited'?'Demasiadas solicitudes, espera un momento.':'No pude responder, intenta de nuevo.'}
// Chat
let hist=[];
const SYS='Te llamas Nova y eres un asistente personal amable. Responde en español, claro y breve.';
async function send(){
 const t=$('#ci').value.trim();if(!t)return;$('#ci').value='';
 $('#log').appendChild(mkEl('b u',t));hist.push({role:'user',content:t});
 const el=mkEl('b a','…');$('#log').appendChild(el);el.scrollIntoView({block:'end'});
 try{
  let m=hist.slice(-10);if(m[0].role==='assistant')m=m.slice(1);
  m=m.map((x,i)=>i===0?{role:x.role,content:SYS+'\n\n'+x.content}:x);
  const r=await ai(m,({text})=>{el.textContent=text});
  el.textContent=r.text;hist.push({role:'assistant',content:r.text});speak(r.text);
 }catch(e){el.textContent=err(e);hist.pop()}
 el.scrollIntoView({block:'end'});
}
$('#send').onclick=send;$('#ci').onkeydown=e=>{if(e.key==='Enter')send()};
// Notas
let notas=st.get('notas',[]);
function rNotas(){const l=$('#nl');l.textContent='';notas.forEach((n,i)=>{const d=mkEl('it','');const s=document.createElement('span');s.textContent=n;const x=document.createElement('button');x.className='x';x.textContent='✕';x.onclick=()=>{notas.splice(i,1);st.set('notas',notas);rNotas()};d.append(s,x);l.appendChild(d)})}
$('#nadd').onclick=()=>{const v=$('#ni').value.trim();if(!v)return;notas.unshift(v);st.set('notas',notas);$('#ni').value='';rNotas()};
// Tareas
let tareas=st.get('tareas',[]);
function rTareas(){const l=$('#tl');l.textContent='';tareas.forEach((t,i)=>{const d=mkEl('it'+(t.d?' d':''),'');const c=document.createElement('input');c.type='checkbox';c.checked=t.d;c.style.flex='none';c.onchange=()=>{t.d=c.checked;st.set('tareas',tareas);rTareas()};const s=document.createElement('span');s.textContent=t.t;const x=document.createElement('button');x.className='x';x.textContent='✕';x.onclick=()=>{tareas.splice(i,1);st.set('tareas',tareas);rTareas()};d.append(c,s,x);l.appendChild(d)})}
function addT(){const v=$('#ti').value.trim();if(!v)return;tareas.push({t:v,d:false});st.set('tareas',tareas);$('#ti').value='';rTareas()}
$('#tadd').onclick=addT;$('#ti').onkeydown=e=>{if(e.key==='Enter')addT()};
// Videos
$('#vgo').onclick=async()=>{
 const tema=$('#vt').value.trim();if(!tema)return;
 const o=$('#vo');o.textContent='';const el=mkEl('out','Pensando ideas…');o.appendChild(el);
 const p='Genera 3 ideas de video corto para '+$('#vp').value+' sobre: '+tema+'. Para cada una: título, gancho de los primeros 3 segundos, guion en 4 pasos y 5 hashtags. Deben poder grabarse solo con un celular, sin presupuesto. Responde en español, sin formato markdown.';
 try{const r=await ai(p,({text})=>{el.textContent=text});el.textContent=r.text}catch(e){el.textContent=err(e)}
};
// Voz
$('#vcopy').onclick=async()=>{try{await navigator.clipboard.writeText($('#vi').value);$('#vmsg').textContent='Copiado.'}catch(e){$('#vmsg').textContent='No pude copiar, selecciona el texto manualmente.'}};
$('#vread').onclick=()=>{const t=$('#vi').value;if(t){const z=$('#vz').checked;$('#vz').checked=true;speak(t);$('#vz').checked=z}};
document.querySelectorAll('.mic').forEach(b=>b.onclick=async()=>{
 if(!dict)return;
 try{if(listening){await dict.stop();return}target=$('#'+b.dataset.for);b.classList.add('on');await dict.start()}catch(e){b.classList.remove('on');$('#vmsg').textContent='No pude activar el micrófono.'}
});
// Render inicial y capacidades
rNotas();rTareas();
(async()=>{
 try{if(window.claude){sample=await claude.use('sample');dict=await claude.use('dictation')}}catch(e){}
 if(!dict){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){let rec=null,cb={};dict={start:async()=>{rec=new SR();rec.lang='es-ES';rec.interimResults=false;rec.onresult=e=>{cb.f&&cb.f({text:e.results[0][0].transcript})};rec.onstart=()=>{cb.s&&cb.s({state:'listening'})};rec.onend=()=>{cb.s&&cb.s({state:'idle'})};rec.start()},stop:async()=>{rec&&rec.stop()},onFinal:f=>{cb.f=f},onState:f=>{cb.s=f}}}}
 if(!dict)document.querySelectorAll('.mic').forEach(b=>b.hidden=true);
 else{
  dict.onFinal(({text})=>{if(target)target.value+=(target.value?' ':'')+text});
  dict.onState(({state})=>{listening=state==='listening';if(!listening)document.querySelectorAll('.mic').forEach(b=>b.classList.remove('on'))});
 }
})();
</script>
</body></html>
